<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm mới - Atiso Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar quản lý -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'manager_products' %}">HỆ THỐNG QUẢN LÝ SHOP</a>
            <a href="{% url 'manager_products' %}" class="btn btn-outline-light btn-sm">← Quay lại danh sách</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4 text-center">Thêm Sản Phẩm Quần Áo Mới</h3>
                        
                        <!-- Form bắt buộc phải có enctype="multipart/form-data" để tải được file ảnh lên -->
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên sản phẩm:</label>
                                <input type="text" name="name" class="form-control" placeholder="Ví dụ: Áo sơ mi nam công sở..." required>
                            </div>
                            
                            
                            <!-- Chọn danh mục sản phẩm -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Danh mục sản phẩm:
                                </label>

                                <select name="category" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>

                                    {% for category in categories %}
                                        <option value="{{ category.id }}">
                                            {{ category.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Giá bán (VNĐ):</label>
                                <input type="number" step="0.01" name="price" class="form-control" placeholder="Ví dụ: 250000" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mô tả chi tiết:</label>
                                <textarea name="description" class="form-control" rows="4" placeholder="Nhập chất liệu, kích thước, màu sắc..."></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Hình ảnh sản phẩm:</label>
                                <input type="file" name="image" class="form-control" accept="image/*">
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{% url 'manager_products' %}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                                <button type="submit" class="btn btn-success px-4 fw-bold">Lưu Sản Phẩm</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
