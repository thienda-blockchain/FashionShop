<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa sản phẩm - Fashion Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar quản lý -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'manager_products' %}">⚙️ HỆ THỐNG QUẢN LÝ SHOP</a>
            <a href="{% url 'manager_products' %}" class="btn btn-outline-light btn-sm">← Quay lại danh sách</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h3 class="fw-bold mb-4 text-center">✏️ Chỉnh Sửa Thông Tin Sản Phẩm</h3>
                        
                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên sản phẩm:</label>
                                <!-- Dùng value="{{ product.name }}" để hiển thị sẵn dữ liệu cũ -->
                                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    Danh mục sản phẩm:
                                </label>

                                <select name="category" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>

                                    {% for category in categories %}
                                        <option value="{{ category.id }}"
                                            {% if product.category_id == category.id %}
                                                selected
                                            {% endif %}>
                                            {{ category.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Giá bán (VNĐ):</label>
                                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mô tả chi tiết:</label>
                                <textarea name="description" class="form-control" rows="4">{{ product.description }}</textarea>
                            </div>

                            <!-- Hiển thị ảnh hiện tại nếu có -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Ảnh hiện tại:</label>
                                <div>
                                    {% if product.image %}
                                        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="rounded mb-2" style="width: 100px; height: 100px; object-fit: cover;">
                                    {% else %}
                                        <p class="text-muted small">Chưa có hình ảnh</p>
                                    {% endif %}
                                </div>
                                <label class="form-label fw-semibold mt-2">Đổi ảnh mới (nếu muốn):</label>
                                <input type="file" name="image" class="form-control" accept="image/*">
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'manager_products' %}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary px-4 fw-bold">Lưu Thay Đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
